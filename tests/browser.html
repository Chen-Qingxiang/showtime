<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShowTime browser smoke tests</title>
<style>
  body { margin: 20px; font: 14px system-ui; background: #10171e; color: #e6edf3; }
  button { font: inherit; padding: 10px; cursor: pointer; }
  iframe { display: block; height: 760px; border: 1px solid #52606f; background: #10171e; }
  pre { white-space: pre-wrap; line-height: 1.5; }
  .frames { overflow: auto; } .pass { color: #9ac7c4; } .fail { color: #ff7a79; }
</style>
<h1>ShowTime browser smoke tests</h1>
<p>Tests the real app at desktop (1280 px) and mobile (390 px) widths. No extra dependencies.</p>
<button id="run" type="button">Run smoke tests</button>
<pre id="results" aria-live="polite">Ready.</pre>
<div class="frames">
  <h2>Desktop · 1280 px</h2><iframe id="desktop" title="Desktop app" style="width:1280px" src="../index.html?v=showtime-20261002-3"></iframe>
  <h2>Mobile · 390 px</h2><iframe id="mobile" title="Mobile app" style="width:390px" src="../index.html?v=showtime-20261002-3"></iframe>
</div>
<script>
(() => {
  const output = document.getElementById('results');
  const frames = ['desktop', 'mobile'].map(id => document.getElementById(id));
  const pause = () => new Promise(resolve => setTimeout(resolve, 40));
  const assert = (ok, message) => { if (!ok) throw new Error(message); };
  let count = 0;
  async function check(name, fn) {
    try { await fn(); count++; output.textContent += `\nPASS ${name}`; }
    catch (error) { output.textContent += `\nFAIL ${name}: ${error.message}`; throw error; }
  }
  async function preferences(frame) {
    const reload = async () => {
      await new Promise(resolve => { frame.addEventListener('load', resolve, { once: true }); frame.contentWindow.location.reload(); });
      await pause();
    };
    await check(`${frame.id}: fresh defaults are Chinese, dark, and Halley off`, async () => {
      for (const key of ['showtime:halley-scale', 'showtime:language', 'showtime:theme']) localStorage.removeItem(key);
      await reload();
      const d = frame.contentWindow.document;
      assert(!d.getElementById('halleyScale').checked, 'fresh Halley default is on');
      assert(d.documentElement.lang.startsWith('zh'), 'fresh language is not Chinese');
      assert(d.documentElement.dataset.theme === 'dark', 'fresh theme is not dark');
    });
    await check(`${frame.id}: deliberate scale, language, and theme choices survive reload`, async () => {
      for (const value of [{ halley: true, language: 'en', theme: 'light' }, { halley: false, language: 'zh', theme: 'dark' }]) {
        const w = frame.contentWindow; const d = w.document; const input = d.getElementById('halleyScale');
        input.checked = value.halley; input.dispatchEvent(new w.Event('change', { bubbles: true }));
        const language = d.getElementById('languageSelect'); language.value = value.language;
        language.dispatchEvent(new w.Event('change', { bubbles: true }));
        if (d.documentElement.dataset.theme !== value.theme) d.getElementById('btn-theme').click();
        await reload();
        const restored = frame.contentWindow.document;
        assert(restored.getElementById('halleyScale').checked === value.halley, 'manual scale preference lost');
        assert(restored.getElementById('languageSelect').value === value.language, 'language preference lost');
        assert(restored.documentElement.dataset.theme === value.theme, 'theme preference lost');
      }
    });
  }
  async function suite(frame) {
    const w = frame.contentWindow; const d = w.document;
    const tag = frame.id;
    const canvas = d.getElementById('c');
    const input = d.getElementById('halleyScale');
    const dialog = d.getElementById('halleyInfo');
    const fire = (el, type) => el.dispatchEvent(new w.Event(type, { bubbles: true }));
    const toggle = value => { input.checked = value; fire(input, 'change'); };
    const language = value => { const select = d.getElementById('languageSelect'); select.value = value; fire(select, 'change'); };
    const zoom = value => { const slider = d.getElementById('zoomSlider'); slider.value = String(value); fire(slider, 'input'); };
    const pointer = (type, x, y) => {
      const rect = canvas.getBoundingClientRect();
      canvas.dispatchEvent(new w.MouseEvent(type, { bubbles: true, clientX: rect.left + x, clientY: rect.top + y, buttons: type === 'mousedown' ? 1 : 0 }));
    };
    const locate = h => {
      if (!dialog.open) d.getElementById('btn-halley-info').click();
      const select = d.getElementById('halleyReturnSelect'); select.value = String(h); fire(select, 'change');
      d.getElementById('halleyLocate').click();
    };
    const drawSignature = () => canvas.toDataURL();
    language('en'); toggle(false); await pause();

    await check(`${tag}: original built-in self-tests`, async () => {
      for (let i = 0; i < 100 && !d.getElementById('testLog').textContent; i++) await pause();
      const log = d.getElementById('testLog').textContent;
      assert(log.includes('✅') && !log.includes('❌'), log);
    });
    await check(`${tag}: enable/disable preserves the original canvas and CSV`, async () => {
      const csv = d.getElementById('csvText').value; const before = drawSignature();
      const originalHeight = canvas.height;
      toggle(true); assert(d.getElementById('halleyScaleStatus').textContent.includes('Halley'), 'scale status missing');
      assert(canvas.height >= originalHeight, 'lost layer height');
      toggle(false); assert(drawSignature() === before, 'main timeline changed when disabled');
      assert(d.getElementById('csvText').value === csv, 'CSV changed');
      toggle(true);
    });
    await check(`${tag}: day/night changes page and canvas, preserving CSV and viewport`, async () => {
      const csv = d.getElementById('csvText').value; const before = drawSignature();
      const oldZoom = d.getElementById('zoomSlider').value;
      d.getElementById('btn-theme').click(); await pause();
      assert(d.documentElement.dataset.theme === 'light', 'light theme is not selected');
      assert(w.getComputedStyle(d.documentElement).colorScheme === 'light', 'page theme did not change');
      assert(before !== drawSignature(), 'canvas palette did not change');
      assert(d.getElementById('btn-theme').textContent.includes('Dark mode'), 'English button label wrong');
      language('zh'); await pause();
      assert(d.getElementById('btn-theme').textContent.includes('夜间模式'), 'Chinese button label wrong');
      assert(d.documentElement.scrollWidth <= w.innerWidth + 1, 'light theme overflows viewport');
      assert(d.getElementById('csvText').value === csv && d.getElementById('zoomSlider').value === oldZoom, 'theme moved the view or changed CSV');
      language('en'); d.getElementById('btn-theme').click(); await pause();
      assert(d.documentElement.dataset.theme === 'dark' && drawSignature() === before, 'night palette did not restore');
    });
    await check(`${tag}: H17 selection, sources, and close`, async () => {
      d.getElementById('btn-halley-info').click();
      assert(dialog.open, 'dialog did not open');
      const detail = d.getElementById('halleyReturnDetail');
      assert(detail.textContent.includes('H17') && detail.textContent.includes('1066-03-26'), 'Gregorian anchor missing');
      assert(detail.textContent.includes('1066-03-20') && detail.querySelectorAll('a').length >= 2, 'source date/links missing');
      d.getElementById('halleyLocate').click(); assert(!dialog.open, 'dialog did not close');
    });
    await check(`${tag}: ancient returns are model years and locate on the extended scale`, async () => {
      d.getElementById('btn-halley-info').click();
      const select = d.getElementById('halleyReturnSelect'); select.value = '-53'; fire(select, 'change');
      const detail = d.getElementById('halleyReturnDetail');
      assert(select.options.length === 84, 'extended return inventory wrong');
      assert(detail.textContent.includes('≈4085 BCE') && detail.textContent.includes('Model estimate'), 'model year or status missing');
      assert(!/4085 BCE-\d\d-\d\d/.test(detail.textContent), 'model displayed as a precise ancient date');
      assert(detail.querySelectorAll('a').length >= 4, 'model references missing');
      d.getElementById('halleyLocate').click();
      assert(d.getElementById('halleyScaleStatus').textContent.includes('H−53'), 'ancient anchor not rendered');
      locate(17);
    });
    await check(`${tag}: interval and point tooltips have exactly two one-decimal Halley rows`, async () => {
      const csv = d.getElementById('csvText').value;
      d.getElementById('csvText').value = '266~316,西晋'; d.getElementById('btn-load').click(); locate(7);
      const left = tag === 'mobile' ? 72 : 80; const right = tag === 'mobile' ? 12 : 20;
      pointer('mousemove', left + (canvas.clientWidth - left - right) / 2, 100);
      const block = d.querySelector('#eventTooltip .halley-event-meta');
      assert(block && block.children.length === 2, 'interval has extra or missing Halley rows');
      assert(block.textContent.includes('H6.6') && block.textContent.includes('0.6 H'), 'one-decimal display is wrong');
      assert(!block.textContent.includes('Returns'), 'return count is still present');
      const detached = d.createElement('div');
      w.ShowtimeHalleyScale.appendEventInfo(detached, 1037, 1040);
      assert(detached.firstChild.children.length === 2 && detached.textContent.includes('0.0 H'), 'no-return interval has different rows');
      detached.replaceChildren(); w.ShowtimeHalleyScale.appendEventInfo(detached, 1066, 1066);
      assert(detached.firstChild.children.length === 2 && detached.textContent.includes('0.0 H'), 'point has different rows');
      d.getElementById('csvText').value = csv; d.getElementById('btn-load').click(); locate(17);
    });
    await check(`${tag}: CSV titles and source text survive both UI languages`, async () => {
      const area = d.getElementById('csvText');
      const text = '1037~1101,苏轼\n240BC,原始标题\n1066,Halley Scale';
      area.value = text; d.getElementById('btn-load').click();
      language('zh'); await pause(); assert(area.value === text, 'Chinese switch changed user CSV');
      language('en'); await pause(); assert(area.value === text, 'English switch changed user CSV');
      locate(17);
    });
    await check(`${tag}: return hover and click work independently of event-tooltip toggle`, async () => {
      const status = d.getElementById('halleyScaleStatus').textContent;
      assert(status.includes('Halley Scale is on'), 'scale is disabled after navigation');
      const left = tag === 'mobile' ? 72 : 80; const right = tag === 'mobile' ? 12 : 20;
      const x = left + (canvas.clientWidth - left - right) / 2;
      const hover = d.getElementById('hoverTooltip'); hover.checked = false; fire(hover, 'change');
      pointer('mousemove', x, 60);
      assert(d.getElementById('halleyTooltip').style.display === 'block', 'return hover is hidden');
      assert(d.getElementById('halleyTooltip').textContent.includes('H17'), 'navigation missed H17');
      pointer('mousedown', x, 60); pointer('mouseup', x, 60);
      assert(dialog.open && d.getElementById('halleyReturnSelect').value === '17', 'return click failed');
      d.getElementById('halleyInfoClose').click(); hover.checked = true; fire(hover, 'change');
    });
    await check(`${tag}: drag pans, wheel zooms and layers remain usable`, async () => {
      const before = drawSignature(); pointer('mousedown', 180, 210);
      pointer('mousemove', 230, 210); pointer('mouseup', 230, 210);
      assert(drawSignature() !== before, 'drag did not pan');
      const slider = d.getElementById('zoomSlider'); const oldZoom = slider.value;
      const rect = canvas.getBoundingClientRect();
      canvas.dispatchEvent(new w.WheelEvent('wheel', { bubbles: true, cancelable: true,
        clientX: rect.left + 200, clientY: rect.top + 210, deltaY: -100 }));
      assert(slider.value !== oldZoom, 'wheel did not zoom');
      d.getElementById('backgroundSelect').value = 'china-dynasties';
      d.getElementById('btn-load-background').click(); await pause(); await pause();
      assert(d.getElementById('testLog').textContent.includes('toggleLayerHidden'), 'layer regression checks absent');
    });
    await check(`${tag}: extreme zooms and unsupported range render without errors`, async () => {
      zoom(0); assert(d.getElementById('halleyScaleStatus').textContent.length > 0, 'empty deep-time status');
      zoom(1000); assert(canvas.width > 0 && canvas.height > 0, 'canvas lost dimensions');
      zoom(400); locate(30); assert(d.getElementById('halleyScaleStatus').textContent.includes('H30'), 'future return missing');
      locate(-5); d.getElementById('btn-halley-info').click();
      const select = d.getElementById('halleyReturnSelect'); select.value = '-5'; fire(select, 'change');
      const detail = d.getElementById('halleyReturnDetail').textContent;
      assert(detail.includes('613 BCE') && detail.includes('616 BCE') && detail.includes('Disputed'), 'disputed record misclassified');
      d.getElementById('halleyInfoClose').click();
    });
    await check(`${tag}: both languages fit the viewport and dialog`, async () => {
      for (const value of ['zh', 'en']) {
        language(value); await pause(); d.getElementById('btn-halley-info').click(); await pause();
        const rect = dialog.getBoundingClientRect();
        assert(rect.left >= 0 && rect.right <= w.innerWidth + 1, 'dialog overflows viewport');
        assert(d.documentElement.scrollWidth <= w.innerWidth + 1, 'horizontal page overflow');
        const detail = d.getElementById('halleyReturnDetail').textContent;
        assert(detail.includes(value === 'zh' ? '近日点' : 'Perihelion'), 'detail language not refreshed');
        d.getElementById('halleyInfoClose').click();
      }
    });
    await check(`${tag}: Su Shi panel, return details, and observation links`, async () => {
      language('en'); d.getElementById('btn-halley-person').click();
      const person = d.getElementById('halleyPerson'); const result = d.getElementById('halleyPersonResult');
      assert(person.open && result.textContent.includes('Su Shi') && result.textContent.includes('0.8 H'), 'one-decimal example not shown');
      assert(result.querySelector('[data-return-h="17"]').textContent.includes('29'), 'Su Shi age missing');
      result.querySelector('[data-return-h="17"] button').click();
      assert(dialog.open && !person.open && d.getElementById('halleyReturnSelect').value === '17', 'return link failed');
      d.getElementById('halleySeeRecords').click();
      assert(d.getElementById('halleyHistory').open && !dialog.open, 'observation link failed');
      assert(d.querySelectorAll('#halleyHistoryRecords [data-record-id]').length === 2, 'same-return records missing');
      d.getElementById('halleyHistoryClose').click();
    });
    await check(`${tag}: imported titles, manual dates, month precision, and invalid biographies`, async () => {
      d.getElementById('btn-halley-person').click();
      const picker = d.getElementById('halleyPersonSelect'); const result = d.getElementById('halleyPersonResult');
      const imported = Array.from(picker.options).find(option => option.value.startsWith('event:') && option.textContent.includes('苏轼'));
      assert(imported, 'imported interval is unavailable'); picker.value = imported.value; fire(picker, 'change');
      const csv = d.getElementById('csvText').value; language('zh'); await pause();
      assert(result.textContent.includes('苏轼') && picker.value === imported.value, 'language lost imported selection');
      assert(d.getElementById('csvText').value === csv, 'person panel changed CSV');
      const form = d.getElementById('halleyPersonForm');
      const analyze = (birth, death) => {
        d.getElementById('halleyPersonName').value = '<b>Original title</b>';
        d.getElementById('halleyBirth').value = birth; d.getElementById('halleyDeath').value = death;
        form.querySelector('button[type="submit"]').click();
      };
      analyze('1037-06-01', '1101-08-24');
      assert(result.querySelector('[data-return-h="17"]').textContent.includes('28'), 'date-level age is wrong');
      assert(result.textContent.includes('<b>Original title</b>') && !result.querySelector('b'), 'title became markup');
      analyze('1900-02', '1986-01'); assert(!result.querySelector('[data-return-h="29"]'), 'death month extends through the whole year');
      analyze('1BC', '1'); assert(result.textContent.includes('1 BC'), 'BCE/CE biography failed');
      analyze('1101', '1037'); assert(d.getElementById('halleyPersonError').textContent, 'reversed interval accepted');
      analyze('0', '1037'); assert(d.getElementById('halleyPersonError').textContent, 'historical zero accepted');
      assert(d.getElementById('csvText').value === csv, 'manual form changed CSV');
      d.getElementById('halleyPersonClose').click(); language('en');
    });
    await check(`${tag}: observation precision, sources, and future status`, async () => {
      d.getElementById('btn-halley-history').click(); const picker = d.getElementById('halleyHistorySelect');
      const records = d.getElementById('halleyHistoryRecords');
      picker.value = '17'; fire(picker, 'change');
      assert(records.textContent.includes('1066-04-30') && records.textContent.includes('1066-04-24'), 'source calendar conversion absent');
      assert(records.querySelectorAll('a').length >= 2, 'sources absent');
      picker.value = '1'; fire(picker, 'change');
      assert(records.textContent.includes('Possible-date window') && records.textContent.includes('Probable'), 'Babylonian precision lost');
      picker.value = '30'; fire(picker, 'change');
      assert(records.textContent.includes('future prediction') && d.getElementById('halleyHistoryLoad').disabled, 'future has invented history');
      d.getElementById('halleyHistoryClose').click();
    });
    await check(`${tag}: evidence layers load once without moving the view or changing CSV`, async () => {
      d.getElementById('btn-halley-history').click(); const picker = d.getElementById('halleyHistorySelect');
      picker.value = 'all'; fire(picker, 'change');
      assert(d.querySelectorAll('#halleyHistoryRecords [data-record-id]').length === 9, 'record inventory wrong');
      const zoomValue = d.getElementById('zoomSlider').value; const csv = d.getElementById('csvText').value;
      d.getElementById('halleyHistoryLoad').click();
      assert(d.getElementById('halleyHistoryStatus').textContent.includes('9'), 'records not loaded');
      d.getElementById('halleyHistoryLoad').click();
      assert(d.getElementById('halleyHistoryStatus').textContent.includes('0'), 'records duplicated');
      assert(d.getElementById('zoomSlider').value === zoomValue && d.getElementById('csvText').value === csv, 'view or CSV changed');
      d.getElementById('halleyHistoryClose').click();
    });
    await check(`${tag}: both new panels fit in both languages`, async () => {
      for (const value of ['zh', 'en']) {
        language(value); await pause();
        for (const [button, id, close] of [['btn-halley-person', 'halleyPerson', 'halleyPersonClose'], ['btn-halley-history', 'halleyHistory', 'halleyHistoryClose']]) {
          d.getElementById(button).click(); const rect = d.getElementById(id).getBoundingClientRect();
          assert(rect.left >= 0 && rect.right <= w.innerWidth + 1, `${id} overflows`);
          assert(d.getElementById(id).scrollWidth <= d.getElementById(id).clientWidth + 1, `${id} content overflows`);
          d.getElementById(close).click();
        }
      }
    });
    if (tag === 'mobile') await check('mobile: tap, pan, and pinch follow the existing touch handlers', async () => {
      locate(17);
      const rect = canvas.getBoundingClientRect();
      const x = 72 + (canvas.clientWidth - 72 - 12) / 2;
      const touch = (id, px, py) => new w.Touch({ identifier: id, target: canvas, clientX: rect.left + px, clientY: rect.top + py });
      const send = (type, touches, changedTouches = touches) => canvas.dispatchEvent(new w.TouchEvent(type,
        { bubbles: true, cancelable: true, touches, targetTouches: touches, changedTouches }));
      const point = touch(1, x, 60); send('touchstart', [point]); send('touchend', [], [point]);
      assert(dialog.open, 'tap did not inspect a return'); d.getElementById('halleyInfoClose').click();
      const before = drawSignature(); send('touchstart', [touch(1, 150, 200)]);
      send('touchmove', [touch(1, 190, 200)]); send('touchmove', [touch(1, 230, 200)]); send('touchend', [], [touch(1, 230, 200)]);
      assert(drawSignature() !== before, 'touch pan did not redraw');
      const oldZoom = d.getElementById('zoomSlider').value;
      send('touchstart', [touch(1, 100, 200), touch(2, 200, 200)]);
      send('touchmove', [touch(1, 90, 200), touch(2, 230, 200)]); send('touchend', [], []);
      assert(d.getElementById('zoomSlider').value !== oldZoom, 'pinch did not zoom');
    });
    locate(17);
  }
  document.getElementById('run').addEventListener('click', async () => {
    document.getElementById('run').disabled = true; count = 0; output.textContent = 'Running…';
    try {
      for (const frame of frames) { await preferences(frame); await suite(frame); }
      output.textContent += `\n\n${count} checks passed. Both frames finish at H17.`;
      output.className = 'pass'; output.dataset.result = 'passed';
    } catch (error) { output.className = 'fail'; output.dataset.result = 'failed'; }
    finally { document.getElementById('run').disabled = false; }
  });
})();
</script>
</html>
